plugins { id 'com.android.application' }

def webDist = file("$rootDir/../web/dist")
def genAssets = layout.buildDirectory.dir("generated/webassets")

tasks.register('copyWebAssets', Sync) {
    from webDist
    into genAssets.map { it.dir("www") }
    doFirst {
        if (!webDist.exists()) throw new GradleException("web/dist bulunamadı. Önce: cd web && npm install && npm run build")
    }
}

android {
    namespace 'com.golgederinlikleri.game'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'com.golgederinlikleri.game'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.2.0'
    }

    signingConfigs {
        release {
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) {
                def props = new Properties()
                propsFile.withInputStream { props.load(it) }
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            } else {
                // Fallback: sign with the local debug key so the APK is installable.
                storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main.assets.srcDirs += [genAssets]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    androidResources {
        noCompress += ['woff2', 'js']
    }
}

tasks.named('preBuild') { dependsOn 'copyWebAssets' }
